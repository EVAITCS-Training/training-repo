# ============================================================================
# NGINX CONFIG — production counterpart of the Vite dev proxy.
# ============================================================================
# This file is what makes the frontend container a COMPLETE deployment unit:
#   1. serves the built SPA (static files)
#   2. implements client-side routing fallback (React Router owns the URLs)
#   3. reverse-proxies /api (and the OpenAPI docs) to the backend container
# so the browser sees ONE origin — cookies/CORS/ports all stop being issues.
#
# In compose, "backend" is the SERVICE NAME; Docker's embedded DNS resolves
# it to the container's IP on the shared network. That's service discovery at
# the compose level — Stage 5 replaces it with Eureka + an API gateway, which
# is the same idea with health checks and load balancing added.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- SPA fallback -------------------------------------------------------
    # Deep links like /transfer hit nginx as a FILE request; there is no such
    # file — dist/ has only index.html + assets. try_files serves the real
    # file when it exists (assets), otherwise index.html, letting React Router
    # render the right page client-side. Without this line: 404 on every F5.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API reverse proxy ---------------------------------------------------
    # proxy_pass WITHOUT a URI part keeps the original path:
    #   browser  GET /api/accounts
    #   backend  GET /api/accounts        (Spring serves it exactly there)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # Forward the real client info — otherwise the backend sees nginx's IP
        # for everyone (logs, rate limits, and audits all need these):
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OpenAPI docs through the same origin (Swagger UI "Try it out") ------
    location /v3/api-docs { proxy_pass http://backend:8080; }
    location /swagger-ui  { proxy_pass http://backend:8080; }

    # Cache the fingerprinted assets aggressively — vite names them
    # index-<hash>.js, so a new build literally cannot collide with old files.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
