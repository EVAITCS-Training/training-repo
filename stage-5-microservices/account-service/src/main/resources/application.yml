# ============================================================================
# ACCOUNT SERVICE — standalone defaults (H2, no Eureka). In compose, the
# Config Server overrides datasource (accountdb) + enables discovery.
# Pattern identical to auth-service/application.yml — see the notes there.
# ============================================================================
server:
  port: 8082

spring:
  application:
    name: account-service       # config-repo/account-service.yml + Eureka name
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mvc:
    problemdetails:
      enabled: true

eureka:
  client:
    enabled: false

# Verifier-side copy of the shared secret (auth-service signs with the same
# value; config-repo unifies them in the stack).
app:
  jwt:
    secret: ${JWT_SECRET:standalone-dev-secret-at-least-32-bytes-long!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
