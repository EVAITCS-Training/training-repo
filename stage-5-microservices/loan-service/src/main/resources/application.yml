# ============================================================================
# LOAN SERVICE — standalone defaults (H2, no Eureka; Kafka send failures are
# logged, not fatal, so the service is demoable alone). Config Server
# overrides datasource (loandb) + eureka + kafka in the stack.
# ============================================================================
server:
  port: 8084

spring:
  application:
    name: loan-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      # Don't let a missing broker block startup in standalone demos —
      # topic creation simply retries when Kafka appears.
      fail-fast: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:standalone-dev-secret-at-least-32-bytes-long!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
