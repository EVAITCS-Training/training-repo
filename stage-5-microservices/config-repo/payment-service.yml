# payment-service — environment config + resilience tuning.
spring:
  datasource:
    url: jdbc:postgresql://db:5432/paymentdb
    username: securebank
    password: securebank
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# ----------------------------------------------------------------------------
# RESILIENCE4J — tuned HERE, centrally, instead of hardcoded in the service.
# Change a threshold = edit config + restart; no rebuild, no redeploy of code.
# (Production takes this further: @RefreshScope + Config Server's /actuator/
#  refresh endpoint applies changes WITHOUT restart — Week 7 lesson.)
# ----------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      account-service:                  # matches @CircuitBreaker(name="account-service")
        sliding-window-size: 10         # judge the last 10 calls
        failure-rate-threshold: 50      # >=50% failures -> OPEN
        wait-duration-in-open-state: 10s  # stay open 10s, then half-open probe
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      account-service:
        max-attempts: 3                 # 1 try + 2 retries
        wait-duration: 500ms
  timelimiter:
    instances:
      account-service:
        timeout-duration: 3s            # default is 1s — too tight for demos
