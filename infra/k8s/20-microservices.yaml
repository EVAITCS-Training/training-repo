# ============================================================================
# THE EIGHT SERVICES AS DEPLOYMENTS + SERVICES
# ============================================================================
# compose -> k8s translation, side by side (first entry annotated in depth,
# the rest follow the identical shape):
#
#   compose service          Deployment (replicas, image, env, probes)
#   container_name           Pod labels (identity comes from LABELS, not names)
#   ports: "8081:8081"       Service (cluster DNS) — NO host ports at all;
#                            external entry is the Ingress in 30-ingress.yaml
#   depends_on: healthy      readinessProbe (traffic) + rollout ordering
#   environment:             env / envFrom ConfigMap+Secret
#   healthcheck              readiness + liveness probes
#
# IMAGES: placeholders for YOUR registry (ghcr.io/..., ECR, ...). Compose
# built images locally; clusters pull from registries — that handoff is the
# release pipeline's job (Week 9).
# ============================================================================

# ---------------------------------------------------------------- auth-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: securebank
spec:
  replicas: 2                # stateless => trivially replicable (unlike Postgres)
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: registry.example.com/securebank/auth-service:latest
          ports: [{ containerPort: 8081 }]
          env:
            # Shared, non-secret config -> ConfigMap (the k8s twin of the
            # Config Server; many estates run BOTH: ConfigMap for platform
            # values, Spring Config Server for app values).
            - name: CONFIG_SERVER_URL
              value: http://config-server:8888
            # Secrets NEVER in the manifest: referenced from a Secret object
            # created by your secret pipeline (sealed-secrets, ESO, ...).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: jwt-secret, key: secret }
          # readiness: OUT of load balancing when failing (rolling updates
          # wait for this before killing the old Pod — zero-downtime deploys).
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 5
          # liveness: RESTART when deadlocked; keep thresholds generous or
          # GC pauses cause restart loops.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits:   { cpu: "1",  memory: 640Mi }
          # graceful shutdown: SIGTERM -> Spring stops accepting, drains
          # in-flight requests (server.shutdown=graceful), then exits.
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }  # let endpoints de-register first
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: securebank
spec:
  selector: { app: auth-service }
  ports: [{ port: 8081, targetPort: 8081 }]
  # ClusterIP (default): reachable as auth-service.securebank.svc only.
  # This Service DNS is what makes Eureka OPTIONAL on k8s (see README table).

# ------------------------------------------------------------- account-service
apiVersion: apps/v1
kind: Deployment
metadata: { name: account-service, namespace: securebank }
spec:
  replicas: 2
  selector: { matchLabels: { app: account-service } }
  template:
    metadata: { labels: { app: account-service } }
    spec:
      containers:
        - name: account-service
          image: registry.example.com/securebank/account-service:latest
          ports: [{ containerPort: 8082 }]
          env:
            - { name: CONFIG_SERVER_URL, value: "http://config-server:8888" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8082 }, initialDelaySeconds: 20, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8082 }, initialDelaySeconds: 40, periodSeconds: 10 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "1", memory: 640Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: account-service, namespace: securebank }
spec:
  selector: { app: account-service }
  ports: [{ port: 8082, targetPort: 8082 }]

