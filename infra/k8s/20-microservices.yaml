# -------------------------------------------------------- notification-service
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, namespace: securebank }
spec:
  replicas: 2   # Kafka consumer group rebalances partitions across replicas —
                # scale = parallelism, for free (Week 7 messaging payoff)
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: registry.example.com/securebank/notification-service:latest
          ports: [{ containerPort: 8085 }]
          env:
            - { name: CONFIG_SERVER_URL, value: "http://config-server:8888" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8085 }, initialDelaySeconds: 20, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8085 }, initialDelaySeconds: 40, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: securebank }
spec:
  selector: { app: notification-service }
  ports: [{ port: 8085, targetPort: 8085 }]

