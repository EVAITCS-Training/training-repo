apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: securebank }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: registry.example.com/securebank/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: CONFIG_SERVER_URL, value: "http://config-server:8888" }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8080 }, initialDelaySeconds: 40, periodSeconds: 10 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "1", memory: 640Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: securebank }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]   # the Ingress targets THIS

# --------------------------------------------------- discovery + config servers
# On Kubernetes, Eureka is often RETIRED: Service DNS + kube-proxy already do
# discovery/load-balancing. We keep it here for parity with the compose stack
# (and because the course teaches it) — but notice how little k8s needs it.
apiVersion: apps/v1
kind: Deployment
metadata: { name: discovery-service, namespace: securebank }
spec:
  replicas: 1
  selector: { matchLabels: { app: discovery-service } }
  template:
    metadata: { labels: { app: discovery-service } }
    spec:
      containers:
        - name: discovery-service
          image: registry.example.com/securebank/discovery-service:latest
          ports: [{ containerPort: 8761 }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8761 }, initialDelaySeconds: 20, periodSeconds: 5 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: 500m, memory: 640Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: discovery-service, namespace: securebank }
spec:
  selector: { app: discovery-service }
  ports: [{ port: 8761, targetPort: 8761 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: config-server, namespace: securebank }
spec:
  replicas: 2     # config is READ at boot by everything: availability matters
  selector: { matchLabels: { app: config-server } }
  template:
    metadata: { labels: { app: config-server } }
    spec:
      containers:
        - name: config-server
          image: registry.example.com/securebank/config-server:latest
          ports: [{ containerPort: 8888 }]
          env:
            # In-cluster: config from a mounted Git-synced volume or the
            # native folder baked into the image by CI.
            - { name: CONFIG_REPO, value: "/config-repo" }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8888 }, initialDelaySeconds: 15, periodSeconds: 5 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: 500m, memory: 640Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: config-server, namespace: securebank }
spec:
  selector: { app: config-server }
  ports: [{ port: 8888, targetPort: 8888 }]
